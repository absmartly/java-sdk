name: Java-SDK
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches:
      - main
      - "release/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 25 is only the runtime for the testJdk25 task; JDK 11 (listed last, so it becomes JAVA_HOME) runs Gradle,
      # compiles the Java 11 bytecode and runs the tests on the floor.
      - name: Setup Java 25 and 11
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: |
            25
            11
          cache: "gradle"

      - name: Build Java SDK
        run: |
          ./gradlew -Porg.gradle.java.installations.fromEnv=JAVA_HOME_25_X64 clean build

      # Launch the installed example: it must load (SLF4J and the SDK on its runtime classpath) and reach the
      # network, where the unreachable placeholder endpoint fails the context load.
      - name: Launch the example
        run: |
          ./gradlew :example:installDist
          set +e
          ABSMARTLY_APIKEY=test ABSMARTLY_APP=app ABSMARTLY_ENV=test example/build/install/example/bin/example > example.log 2>&1
          set -e
          cat example.log
          if grep -q "NoClassDefFoundError\|ClassNotFoundException" example.log; then exit 1; fi
          grep -q "ContextLoadException" example.log

  # The latest LTS as a second runtime for the whole suite, next to the Java 11 floor above.
  test-jdk21:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Test on Java 21
        run: ./gradlew :core-api:test -PskipJdk25
