plugins {
	id "java-library"
}


description = """ABSmartly Java SDK"""


def httpClientVersion = "5.1.3"

dependencies {
	implementation group: "org.slf4j", name: "slf4j-api", version: slf4jVersion

	implementation group: "org.apache.httpcomponents.client5", name: "httpclient5", version: httpClientVersion
	implementation group: "org.apache.httpcomponents.client5", name: "httpclient5-fluent", version: httpClientVersion

	api group: "net.sourceforge.streamsupport", name: "streamsupport-minifuture", version: "1.7.4"

	implementation group: "com.google.code.findbugs", name: "jsr305", version: "3.0.2"
	implementation group: "com.google.code.findbugs", name: "findbugs-annotations", version: "3.0.1"

	implementation group: "com.fasterxml.jackson.core", name: "jackson-databind", version: jacksonVersion
	implementation group: "com.fasterxml.jackson.datatype", name: "jackson-datatype-jsr310", version: jacksonDataTypeVersion

	testImplementation group: "org.junit.jupiter", name: "junit-jupiter-api", version: junitVersion
	testImplementation group: "org.junit.jupiter", name: "junit-jupiter-params", version: junitVersion
	testRuntimeOnly group: "org.junit.jupiter", name: "junit-jupiter-engine", version: junitVersion
	testImplementation group: "org.mockito", name: "mockito-core", version: mockitoVersion
	testImplementation group: "org.mockito", name: "mockito-junit-jupiter", version: mockitoVersion
	// Mockito 5.11 ships Byte Buddy 1.14, which cannot instrument classes on a JDK 25 runtime.
	testImplementation group: "net.bytebuddy", name: "byte-buddy", version: byteBuddyVersion
	testImplementation group: "net.bytebuddy", name: "byte-buddy-agent", version: byteBuddyVersion
}

check.dependsOn jacocoTestCoverageVerification

def jacocoExcludes = [
	"com/absmartly/sdk/json/**/*",
	"com/absmartly/sdk/deprecated/**/*",
	"com/absmartly/sdk/java/**/*",
	"com/absmartly/sdk/internal/SdkVersion*",
]

jacocoTestReport {
	afterEvaluate {
		getClassDirectories().setFrom(classDirectories.files.collect {
			fileTree(dir: it, exclude: jacocoExcludes)
		})
	}
}

jacocoTestCoverageVerification {
	violationRules {
		rule {
			limit {
				counter = "CLASS"
				value = "COVEREDRATIO"
				minimum = 1.0
			}

			limit {
				counter = "METHOD"
				value = "COVEREDRATIO"
				minimum = 0.90
			}

			limit {
				counter = "INSTRUCTION"
				value = "COVEREDRATIO"
				minimum = 0.88
			}
		}
	}

	afterEvaluate {
		getClassDirectories().setFrom(classDirectories.files.collect {
			fileTree(dir: it, exclude: jacocoExcludes)
		})
	}
}


test {
	useJUnitPlatform()
	jvmArgs '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
			'--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED',
			'--add-opens', 'java.base/java.util=ALL-UNNAMED',
			'--add-opens', 'java.base/java.util.concurrent=ALL-UNNAMED'
}

publishToSonatype.dependsOn check


// Generates SdkVersion from the root project's VERSION so the X-Agent header, the sdk_version
// system attribute and the published artifact share one source of truth.
def generatedVersionDir = layout.buildDirectory.dir("generated/sources/sdkVersion/java")

def generateSdkVersion = tasks.register("generateSdkVersion") {
	def version = rootProject.ext.VERSION
	def outputDir = generatedVersionDir
	inputs.property("version", version)
	outputs.dir(outputDir)
	doLast {
		def file = outputDir.get().file("com/absmartly/sdk/internal/SdkVersion.java").asFile
		file.parentFile.mkdirs()
		file.text = """package com.absmartly.sdk.internal;

public final class SdkVersion {
	public static final String NAME = "absmartly-java-sdk";
	public static final String VERSION = "${version}";
	public static final String AGENT = NAME + "/" + VERSION;

	private SdkVersion() {}
}
"""
	}
}

sourceSets.main.java.srcDir(generateSdkVersion)


// streamsupport-minifuture fails on JDK 24+ once its default async pool is touched, so the SDK is
// also tested on a JDK 25 runtime. The build JDK still compiles the 1.6 bytecode; the toolchain only
// provides the test JVM.
tasks.register("testJdk25", Test) {
	description = "Runs the tests on a JDK 25 runtime."
	group = "verification"
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	javaLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(25)
	}
	useJUnitPlatform()
	jvmArgs test.jvmArgs
	// With parallelism 1 the backport skips its ForkJoinPool, hiding the failure on small machines.
	systemProperty "java.util.concurrent.ForkJoinPool.common.parallelism", "4"
	jacoco {
		enabled = false
	}
}

check.dependsOn "testJdk25"
