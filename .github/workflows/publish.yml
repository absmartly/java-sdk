name: Publish Java-SDK

# Publishes both lines: v2.* tags from main, v1.* tags from release/1.x. Maven Central keeps every version side by
# side; the GitHub release for a 1.x tag is created with --latest=false so a 1.x patch never becomes "latest".
on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches VERSION
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(sed -n 's/^\s*VERSION = "\(.*\)"$/\1/p' build.gradle)
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag v$TAG does not match VERSION $VERSION in build.gradle"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Setup Java 25 and 11
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: |
            25
            11
          cache: "gradle"

      - name: Publish JavaSDK
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GRADLE_PROPERTIES: ${{ secrets.GRADLE_PROPERTIES }}
          SECRET_FILE_DATA: ${{ secrets.SECRET_FILE_DATA }}
        run: |
          export GPG_TTY=$(tty)
          mkdir -p ~/.gradle/
          ln -s /usr/local/bin/gpg /usr/local/bin/gpg2 || true
          echo -n "$SECRET_FILE_DATA" | base64 --decode | gpg --import --passphrase "$ORG_GRADLE_PROJECT_signingInMemoryKeyPassword" --batch
          echo "GRADLE_USER_HOME=${HOME}/.gradle" >> $GITHUB_ENV
          echo "${GRADLE_PROPERTIES}" > ~/.gradle/gradle.properties
          ./gradlew -Porg.gradle.java.installations.fromEnv=JAVA_HOME_25_X64 clean build publishToSonatype closeAndReleaseSonatypeStagingRepository

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$VERSION" == 1.* ]]; then
            LATEST="--latest=false"
          else
            LATEST="--latest"
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME" $LATEST
