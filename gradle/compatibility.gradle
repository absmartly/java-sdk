// Enforces the API floor on production sources using Animal Sniffer. Each signature is checked separately.
// Test sources are excluded: their dependencies (JUnit 5, Mockito 5) require Java 11+ APIs.
def signatures = [
	"core-api": [
		"org.codehaus.mojo.signature:java18:1.0@signature",
		"net.sf.androidscents.signature:android-api-level-24:7.0_r2@signature",
	],
	// java16:1.1 is the Java 1.6 signature despite the artifact name.
	"core-api-java6": [
		"org.codehaus.mojo.signature:java16:1.1@signature"
	],
]

if (signatures.containsKey(project.name)) {
	apply plugin: "ru.vyarus.animalsniffer"

	animalsniffer {
		sourceSets = [sourceSets.main]
	}

	dependencies {
		signatures[project.name].each { signature it }
	}
}
