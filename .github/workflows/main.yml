name: Java-SDK
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # JDK 25 is only the runtime for the testJdk25 task; JDK 11 (listed last, so it becomes JAVA_HOME) runs Gradle
      # and compiles the Java 1.6 bytecode.
      - name: Setup Java 25 and 11
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: |
            25
            11
          cache: "gradle"

      - name: Build Java SDK
        run: |
          ./gradlew -Porg.gradle.java.installations.fromEnv=JAVA_HOME_25_X64 clean build
