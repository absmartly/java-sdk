plugins {
	id "java"
	id "groovy"
	id "jacoco"

	id "com.diffplug.spotless" version "6.25.0"
	id "com.adarshr.test-logger" version "4.0.0"
	id "org.barfuin.gradle.jacocolog" version "3.1.0"
	id "io.github.gradle-nexus.publish-plugin" version "2.0.0"
	id "ru.vyarus.animalsniffer" version "1.7.1" apply false
	id "com.github.johnrengelman.shadow" version "8.1.1" apply false
}


ext {
	VERSION = "2.0.0"
	GROUP_ID = "com.absmartly.sdk"

	slf4jVersion = "2.0.16"
	jspecifyVersion = "1.0.0"

	// Shaded and relocated into core-api. Kept on 2.13 because Jackson 2.14+ needs Android API 26.
	jacksonVersion = "2.13.5"

	junitVersion = "5.10.2"
	mockitoVersion = "5.11.0"
	byteBuddyVersion = "1.17.7"
}


allprojects {
	group = GROUP_ID

	apply plugin: "java"
	apply from: rootProject.file("gradle/repositories.gradle")
	apply from: rootProject.file("gradle/spotless.gradle")
	apply from: rootProject.file("gradle/test-logger.gradle")
	apply from: rootProject.file("gradle/jacoco.gradle")
	apply from: rootProject.file("gradle/coverage-logger.gradle")
	apply from: rootProject.file("gradle/compatibility.gradle")

	tasks.withType(JavaCompile).configureEach {
		options.release = 11
		options.encoding = "UTF-8"
	}

	tasks.withType(Test).configureEach {
		systemProperty "file.encoding", "UTF-8"
	}
}


configure(subprojects.findAll {
	[
		"core-api"
	].contains(it.name)
}) {
	apply plugin: "signing"
	apply plugin: "maven-publish"

	task sourcesJar(type: Jar, dependsOn: classes) {
		archiveClassifier.set('sources')
		from sourceSets.main.allSource
	}

	task javadocJar(type: Jar, dependsOn: javadoc) {
		archiveClassifier.set('javadoc')
		from javadoc.destinationDir
	}

	afterEvaluate {
		publishing {
			publications {
				release(MavenPublication) {
					// The shaded jar, with only the shadow configuration (slf4j-api, jspecify) in the POM.
					project.shadow.component(it)
					artifact sourcesJar
					artifact javadocJar

					artifactId = project.name
					version = VERSION
					groupId = GROUP_ID

					pom {
						name = "ABsmartly Java SDK"
						description = "ABsmartly Java SDK"
						url = "https://www.absmartly.com"
						packaging = "jar"

						licenses {
							license {
								name = "The Apache License, Version 2.0"
								url = "http://www.apache.org/licenses/LICENSE-2.0.txt"
							}
						}

						developers {
							developer {
								id = "absmartly"
								name = "A/B Smartly"
								email = "dev@absmartly.com"
							}
						}

						// Callers compile against the JSpecify annotations (Kotlin reads them for nullability) and SLF4J.
						withXml {
							asNode().dependencies.dependency.each { dep ->
								dep.scope*.value = "compile"
							}
						}

						scm {
							connection = "scm:git:git://github.com/absmartly/java-sdk.git"
							developerConnection = "scm:git:ssh://github.com/absmartly/java-sdk.git"
							url = "https://github.com/absmartly/java-sdk"
						}
					}
				}
			}
		}

		signing {
			useGpgCmd()

			sign publishing.publications.release
		}
	}
}

configure(rootProject) {
	apply plugin: "io.github.gradle-nexus.publish-plugin"

	nexusPublishing {
		repositories {
			Sonatype {
				nexusUrl = uri("https://ossrh-staging-api.central.sonatype.com/service/local/")
				snapshotRepositoryUrl = uri("https://central.sonatype.com/repository/maven-snapshots/")

				username = System.getenv('ORG_GRADLE_PROJECT_mavenCentralUsername')
				password = System.getenv('ORG_GRADLE_PROJECT_mavenCentralPassword')
			}
		}
	}
}
