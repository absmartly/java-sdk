plugins {
	id "org.gradle.toolchains.foojay-resolver-convention" version "0.8.0"
}

rootProject.name = "java-sdk"

def includeDir(dir, parentName) {
	if (new File(dir, "build.gradle").exists()) {
		include "${parentName}:${dir.name}"

		dir.eachDir {
			includeDir(it, "${parentName}:${dir.name}")
		}
	}
}

rootDir.eachDir {
	includeDir(it, "")
}
